<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - UPSC Workflow</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-auth">
    <div class="auth-shell">
      <header class="login-topbar">
        <div class="brand">UPSC Platform</div>
        <nav class="top-actions">
          <a href="#" class="nav-link">Login</a>
          <a href="#" class="nav-link">Register</a>
        </nav>
      </header>

      <div class="auth-card">
        <h1>Welcome Back 👋</h1>
        <p class="subtitle">Continue your learning journey</p>

        <div class="role-toggle">
          <label><input type="radio" name="role" checked /> Student</label>
          <label><input type="radio" name="role" /> Admin</label>
        </div>

        <form class="auth-form">
          <label class="field-label">
            <span>Email Address</span>
            <div class="input-box">
              <span>📧</span>
              <input type="email" placeholder="example@gmail.com" required />
            </div>
          </label>

          <label class="field-label">
            <span>Password</span>
            <div class="input-box">
              <span>🔒</span>
              <input type="password" placeholder="•••••••••••••" required />
              <span class="eye">👁</span>
            </div>
          </label>

          <div class="form-row">
            <label class="checkbox-row"><input type="checkbox" /> Remember Me</label>
            <a href="#" class="link-text">Forgot Password?</a>
          </div>

          <a class="primary-btn login-btn" href="frontend.html">LOGIN →</a>
        </form>

        <p class="helper">Don't have an account? <a href="#" class="link-text">Register Here</a></p>
      </div>
    </div>
  </body>
</html>
